<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurea · Salvatore Daniel Leocata</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #F5C842;
      --blue: #60A5FA;
      --white: #F8FAFC;
      --dim: rgba(248,250,252,.38);
      --bg: #03080F;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    canvas#bg { position: fixed; inset: 0; z-index: 0; }

    #stage {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 0;
    }

    /* ── REVEAL ── */
    .r {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1);
    }
    .r.v { opacity: 1; transform: translateY(0); }

    /* ── ELEMENTS ── */
    #tagline {
      font-size: clamp(11px, 1.6vw, 13px);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 22px;
    }

    #emoji-wrap {
      font-size: clamp(52px, 9vw, 88px);
      line-height: 1;
      margin-bottom: 20px;
      display: inline-block;
      filter: drop-shadow(0 0 24px rgba(245,200,66,.5));
    }

    #label {
      font-size: clamp(10px, 1.4vw, 12px);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 10px;
    }

    #name {
      font-size: clamp(40px, 9vw, 108px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
      color: var(--gold);
      text-shadow: 0 0 80px rgba(245,200,66,.35), 0 0 160px rgba(245,200,66,.1);
      margin-bottom: 4px;
    }

    #surname {
      font-size: clamp(22px, 4.5vw, 56px);
      font-weight: 300;
      letter-spacing: .07em;
      color: var(--white);
      opacity: .9;
      margin-bottom: 26px;
    }

    .divider {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,200,66,.5), transparent);
      margin-bottom: 22px;
      transition: width 1.4s cubic-bezier(.22,1,.36,1);
    }
    .divider.v { width: min(380px, 80vw); }

    #degree {
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 500;
      color: var(--white);
      margin-bottom: 5px;
    }

    #university {
      font-size: clamp(11px, 1.6vw, 13px);
      color: var(--dim);
      letter-spacing: .06em;
      margin-bottom: 30px;
    }

    #date {
      font-size: clamp(24px, 5.5vw, 56px);
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--blue);
      text-shadow: 0 0 50px rgba(96,165,250,.35);
      margin-bottom: 8px;
    }

    #location {
      font-size: clamp(11px, 1.5vw, 13px);
      color: var(--dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 42px;
    }

    #cta {
      display: inline-block;
      padding: 15px 36px;
      background: var(--gold);
      color: #03080F;
      text-decoration: none;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 700;
      letter-spacing: .04em;
      border-radius: 100px;
      box-shadow: 0 0 50px rgba(245,200,66,.25);
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    @media(hover:hover) and (pointer:fine){
      #cta:hover { transform: scale(1.05); box-shadow: 0 0 80px rgba(245,200,66,.5); }
    }
    #cta:active { transform: scale(0.97); }

    @media(max-height:620px){
      #emoji-wrap { font-size: 36px; margin-bottom: 10px; }
      #name { font-size: 38px; }
      #surname { font-size: 20px; margin-bottom: 14px; }
      #date { font-size: 24px; }
      #university, #location { margin-bottom: 14px; }
      #cta { padding: 12px 26px; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="stage">
  <div id="tagline" class="r">Sei invitato a festeggiare la</div>
  <div id="emoji-wrap" class="r">🎓</div>
  <div id="label" class="r">LAUREA MAGISTRALE DI</div>
  <div id="name" class="r">SALVATORE</div>
  <div id="surname" class="r">DANIEL LEOCATA</div>
  <div class="divider" id="div"></div>
  <div id="degree" class="r">Ingegneria Informatica</div>
  <div id="university" class="r">Politecnico di Torino</div>
  <div id="date" class="r">3 OTTOBRE 2026</div>
  <div id="location" class="r">Beauty Garden Banqueting · Biancavilla, CT</div>
  <a href="./graduation.html" id="cta" class="r">Conferma la tua presenza →</a>
</div>

<script>
// ── STARFIELD + PARTICLES ─────────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

const STAR_COUNT = 220;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x:     Math.random(),
  y:     Math.random(),
  r:     Math.random() * 1.6 + 0.2,
  phase: Math.random() * Math.PI * 2,
  speed: Math.random() * 0.008 + 0.002,
}));

class Particle {
  constructor(init) {
    this.reset(init);
  }
  reset(init = false) {
    this.x  = Math.random() * canvas.width;
    this.y  = init ? Math.random() * canvas.height : canvas.height + 8;
    this.vy = -(Math.random() * 0.45 + 0.1);
    this.vx = (Math.random() - 0.5) * 0.25;
    this.r  = Math.random() * 1.8 + 0.4;
    this.life = 0;
    this.max  = Math.random() * 320 + 180;
    this.peak = Math.random() * 0.55 + 0.12;
    this.hue  = 205 + Math.random() * 50;
  }
  tick() {
    this.x += this.vx; this.y += this.vy; this.life++;
    const p = this.life / this.max;
    this.alpha = p < 0.2 ? (p/0.2)*this.peak
               : p > 0.8 ? ((1-p)/0.2)*this.peak
               : this.peak;
    if (this.life >= this.max || this.y < -10) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = `hsl(${this.hue},70%,72%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

const particles = Array.from({length: 70}, (_, i) => new Particle(i < 50));

// Mouse parallax
let mx = 0, my = 0;
window.addEventListener('mousemove', e => { mx = e.clientX/innerWidth - .5; my = e.clientY/innerHeight - .5; });

let t = 0;
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Radial bg
  const g = ctx.createRadialGradient(
    canvas.width*(.5+mx*.05), canvas.height*(.5+my*.05), 0,
    canvas.width*.5, canvas.height*.5, canvas.width*.85
  );
  g.addColorStop(0, '#0A1E3A');
  g.addColorStop(1, '#03080F');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  stars.forEach(s => {
    const a = 0.25 + 0.6 * Math.sin(t * s.speed + s.phase);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc((s.x + mx*.015) * canvas.width, (s.y + my*.015) * canvas.height, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  particles.forEach(p => { p.tick(); p.draw(); });

  t++;
  requestAnimationFrame(loop);
}
loop();

// ── REVEAL SEQUENCE ───────────────────────────────────────
const seq = [
  ['tagline',    300],
  ['emoji-wrap', 850],
  ['label',      1400],
  ['name',       1950],
  ['surname',    2350],
  ['div',        2800],
  ['degree',     3300],
  ['university', 3600],
  ['date',       4100],
  ['location',   4500],
  ['cta',        5100],
];

seq.forEach(([id, delay]) => {
  setTimeout(() => document.getElementById(id).classList.add('v'), delay);
});

// ── CONFETTI BURST at name reveal ────────────────────────
setTimeout(() => {
  const opts = {
    origin: { x: .5, y: .42 },
    colors: ['#F5C842','#60A5FA','#ffffff','#F0ABFC','#34D399','#FFD700'],
    disableForReducedMotion: true,
  };
  confetti({ ...opts, particleCount: 70, angle: 60, spread: 55 });
  setTimeout(() => confetti({ ...opts, particleCount: 70, angle: 120, spread: 55 }), 180);
  setTimeout(() => confetti({
    ...opts, particleCount: 50,
    spread: 360, startVelocity: 18,
    gravity: 0.55, scalar: 0.8,
  }), 380);
}, 2100);
</script>
</body>
</html>
